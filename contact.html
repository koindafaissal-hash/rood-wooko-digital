<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Rood Wooko Digital</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="max-w-2xl mx-auto p-6">
<a href="index.html" class="text-sm text-gray-500">← Retour à l'accueil</a>
<h1 class="text-3xl font-bold mt-4">Contactez-nous</h1>
<p class="text-gray-600 mt-2">Parlez-nous de votre projet. Réponse rapide sur WhatsApp.</p>

<form class="bg-white p-6 rounded-xl shadow mt-6 space-y-4">
<div>
<label class="text-sm font-medium">Nom complet *</label>
<input id="name" name="name" required class="w-full border rounded-lg p-3 mt-1" placeholder="Ex: Faïssal Koinda">
</div>
<div>
<label class="text-sm font-medium">Email *</label>
<input id="email" name="email" type="email" required class="w-full border rounded-lg p-3 mt-1" placeholder="exemple@gmail.com">
</div>
<div>
<label class="text-sm font-medium">Téléphone</label>
<input id="phone" name="phone" class="w-full border rounded-lg p-3 mt-1" placeholder="+226 ...">
</div>
<div>
<label class="text-sm font-medium">Service souhaité</label>
<select id="service" name="service" class="w-full border rounded-lg p-3 mt-1">
<option>Site vitrine</option>
<option>Boutique en ligne</option>
<option>Application web</option>
<option>Autre projet</option>
</select>
</div>
<div>
<label class="text-sm font-medium">Votre message *</label>
<textarea id="message" name="message" required rows="5" class="w-full border rounded-lg p-3 mt-1" placeholder="Décrivez votre projet..."></textarea>
</div>

<div id="form-status" style="display:none;"></div>

<button type="submit" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg">Envoyer le message</button>
<button type="button" id="email-btn" class="w-full border border-gray-300 bg-white font-bold py-3 rounded-lg mt-2">Envoyer par e-mail</button>
</form>

<p class="text-center text-sm text-gray-500 mt-4">WhatsApp : +226 56 43 31 22 | Email : koindafaissal@gmail.com</p>
</div>

<script>
  const WHATSAPP_NUMBER = "22656433122";
  const EMAIL_TO = "koindafaissal@gmail.com";
  const form = document.querySelector("form");
  const statusBox = document.getElementById("form-status");
  function getData() {
    return {
      nom: document.getElementById("name").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      service: document.getElementById("service").value,
      message: document.getElementById("message").value
    };
  }
  function buildMessage(d) {
    return "Bonjour Rood Wooko,\n\nNouvelle demande depuis le site :\n\nNom : " + d.nom + "\nEmail : " + d.email + "\nTelephone : " + d.phone + "\nObjet : " + d.service + "\n\nMessage :\n" + d.message;
  }
  function showOk(text) {
    statusBox.textContent = text;
    statusBox.style.display = "block";
    statusBox.style.background = "#e6f9ed";
    statusBox.style.color = "#14532d";
    statusBox.style.padding = "12px";
    statusBox.style.borderRadius = "8px";
  }
  form.addEventListener("submit", function(e) {
    e.preventDefault();
    const d = getData();
    const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(buildMessage(d));
    showOk("Merci " + d.nom + " ! Ton message est prêt sur WhatsApp, appuie sur Envoyer là-bas.");
    window.open(url, "_blank");
    form.reset();
  });
  document.getElementById("email-btn").addEventListener("click", function(e) {
    e.preventDefault();
    const d = getData();
    const subject = encodeURIComponent("Demande site web - " + d.service + " - " + d.nom);
    const body = encodeURIComponent(buildMessage(d));
    showOk("Ton application e-mail va s'ouvrir avec le message déjà rempli.");
    window.location.href = "mailto:" + EMAIL_TO + "?subject=" + subject + "&body=" + body;
  });
</script>
</body>
</html>
